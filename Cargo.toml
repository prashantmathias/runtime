[package]
name = "runtime"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
# Bun's JavaScriptCore build allocates via mimalloc v3 but doesn't bundle it.
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
oxc = { version = "=0.146.0", features = ["semantic", "transformer", "codegen"] }
tokio = { version = "1.52.3", features = ["full"] }
