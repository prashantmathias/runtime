[package]
name = "runtime"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
# Bun's JavaScriptCore build allocates via mimalloc v3 but doesn't bundle it.
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
oxc = { version = "=0.146.0", features = ["semantic", "transformer", "codegen"] }
oxc_resolver = "11"
 serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = "0.28"
url = "2.5"
